site_name: FACIS Zero Trust Demonstrator
site_description: Zero Trust demonstrator for the FACIS project, released under Eclipse XFSC
repo_url: https://github.com/eclipse-xfsc/facis-zero-trust-demonstrator
edit_uri: edit/main/docs/
copyright: Apache-2.0

# The contract validator and its vendored schema are repository tooling, not documentation.
exclude_docs: |
  contracts/tooling/

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Features and journeys: features.md
  - Architecture: architecture.md
  - Using the demonstrator: usage.md
  - Deployment: deployment.md
  - Umbrella chart: umbrella-chart.md
  - Workload identity: workload-identity.md
  - Environments:
      - Overview: environments/index.md
      - T-Systems OSC: environments/osc.md
      - IONOS Cloud: environments/ionos.md
      - Application workloads: environments/application-workloads.md
      - Capability sheets: environments/capabilities/index.md
  - Packaging and containers: packaging.md
  - Application services: application-services.md
  - Application service verification: application-services-verification.md
  - Orchestrated flows: flows.md
  - Scenario decisions: scenarios.md
  - Keycloak integration: keycloak.md
  - Demonstrator UI and identity: demonstrator-handoff.md
  - Identity model: identity-model.md
  - Connector OAuth2 provider: oauth2-provider.md
  - Guard policy hook: policy-hook.md
  - API documentation: api-docs.md
  - Interface contracts: contracts/index.md
  - TRAIN trust-list publishing: tspa-publish-api.md
  - TRAIN DNS zone: train-dns.md
  - BDD acceptance:
      - Harness and pack: bdd.md
      - Catalogue: bdd-catalogue.md
  - CI/CD: ci-cd.md
  - Secrets: secrets.md
  - Troubleshooting: troubleshooting.md
  - OSS dependencies: dependencies.md
  - Licenses: licenses.md
  - Specification changes: specifications.md
  - Evidence:
      - "Mesh mode, upstream state: about": evidences/mesh-mode-upstream-state/README.md
      - "Mesh mode, upstream state: record": evidences/mesh-mode-upstream-state/upstream-state.md
  - Architecture decisions:
      - Overview: adr/index.md
      - Decision ledger: adr/decision-ledger.md
      - TDR decisions ADR 001–006: adr/tdr-decisions.md
      - 0001 Service mesh mode (superseded by 0009): adr/0001-service-mesh-mode-istio-ambient-with-cilium.md
      - 0002 Gatekeeper external data provider: adr/0002-gatekeeper-external-data-provider-for-cosign-verification.md
      - 0003 OAuth2 surface in the Go connector: adr/0003-oauth2-authorisation-surface-in-the-go-connector.md
      - 0004 OpenBao as X.509 key-value store: adr/0004-openbao-as-x509-key-value-store.md
      - 0005 Three-cluster target environment: adr/0005-three-cluster-reading-of-the-target-environment.md
      - 0009 Service mesh mode (sidecar, supersedes 0001): adr/0009-service-mesh-mode-istio-sidecar-with-cilium.md
      - 0008 Guard policy hook: adr/0008-envoy-ext-authz-as-the-guard-policy-hook.md
      - 0011 Mock TEE evidence: adr/0011-mock-tee-evidence-format-and-provisioning.md
      - 0016 OAuth2 library: adr/0016-oauth2-library-behind-the-connector-provider-contract.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
