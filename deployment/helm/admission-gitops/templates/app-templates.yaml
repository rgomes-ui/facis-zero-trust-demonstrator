{{- /*
The constraint templates (deployment/admission/templates): wave 0, before the constraints, because
Gatekeeper creates the CRD of each constraint kind from its template.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admission-templates
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "admgitops.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ztd-admission
  source:
    {{- include "admgitops.source" (dict "ctx" . "path" "templates") | nindent 4 }}
    directory:
      recurse: false
  destination:
    server: {{ .Values.destination.server | quote }}
    namespace: {{ .Values.gatekeeper.namespace | quote }}
  syncPolicy:
    {{- include "admgitops.syncPolicy" . | nindent 4 }}
