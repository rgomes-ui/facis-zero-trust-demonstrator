---
# The zone's public face: UDP and TCP 53 on one address.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tzm.name" . }}-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tzm.labels" . | nindent 4 }}
  {{- with .Values.service.dns.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.dns.type }}
  {{- if and (eq .Values.service.dns.type "LoadBalancer") .Values.service.dns.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.dns.loadBalancerIP | quote }}
  {{- end }}
  {{- if ne .Values.service.dns.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.service.dns.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "tzm.selector" . | nindent 4 }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
      {{- if and (ne .Values.service.dns.type "ClusterIP") .Values.service.dns.nodePort }}
      nodePort: {{ .Values.service.dns.nodePort }}
      {{- end }}
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
      {{- if and (ne .Values.service.dns.type "ClusterIP") .Values.service.dns.nodePort }}
      nodePort: {{ .Values.service.dns.nodePort }}
      {{- end }}
---
# The API, inside the plane only: the trust-framework manager writes the pointer records through it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tzm.name" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tzm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.api.type }}
  selector:
    {{- include "tzm.selector" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.api.port }}
      targetPort: api
      protocol: TCP
