{{- include "ztd.validate" . -}}
{{- if and (not .Values.externalSecrets.enabled) (not .Values.personas.existingSecret) }}
{{- $name := include "ztd.personaSecret" . -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $input := dict -}}
{{- if .Values.personas.credentialsJSON -}}
{{- $json := mustFromJson .Values.personas.credentialsJSON -}}
{{- $input = required "credentialsJSON requires a personas object" $json.personas -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ztd.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $name := list "demo-operator" "demo-observer" "bdd-operator" "bdd-observer" }}
  {{- $password := "" -}}
  {{- if $input -}}
    {{- $record := required (printf "Missing persona %s" $name) (index $input $name) -}}
    {{- $password = required (printf "Missing password for %s" $name) $record.password -}}
    {{- if not (kindIs "string" $password) -}}{{- fail "Persona passwords must be strings" -}}{{- end -}}
  {{- else if $old -}}
    {{- $password = required (printf "Existing persona Secret lacks %s" $name) (index $old.data $name) | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 48 -}}
  {{- end }}
  {{ $name }}: {{ $password | b64enc | quote }}
  {{ $name }}-json: {{ $password | toJson | b64enc | quote }}
{{- end }}
---
{{- end }}
{{- $stateName := printf "%s-state" (include "ztd.fullname" .) -}}
{{- $state := lookup "v1" "Secret" .Release.Namespace $stateName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $stateName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ztd.labels" . | nindent 4 }}
type: Opaque
data:
  encryption-key: {{ if $state }}{{ required "State Secret requires encryption-key" (index $state.data "encryption-key") | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
