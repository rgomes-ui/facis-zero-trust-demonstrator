{{- if .Values.externalSecrets.enabled }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "ztd.fullname" . }}-openbao-admin
  labels:
    {{- include "ztd.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.storeRef | nindent 4 }}
  target:
    name: {{ include "ztd.adminSecret" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ .Values.admin.passwordKey }}: {{ "{{ .password }}" | quote }}
        {{- if .Values.admin.usernameKey }}
        {{ .Values.admin.usernameKey }}: {{ "{{ .username }}" | quote }}
        {{- end }}
  data:
    - secretKey: password
      remoteRef: {key: {{ .Values.externalSecrets.adminPath | quote }}, property: password}
    {{- if .Values.admin.usernameKey }}
    - secretKey: username
      remoteRef: {key: {{ .Values.externalSecrets.adminPath | quote }}, property: username}
    {{- end }}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "ztd.personaSecret" . }}
  labels:
    {{- include "ztd.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.storeRef | nindent 4 }}
  target:
    name: {{ include "ztd.personaSecret" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- range $index, $name := list "demo-operator" "demo-observer" "bdd-operator" "bdd-observer" }}
        {{ $name }}: {{ printf "{{ .password%d }}" $index | quote }}
        {{ $name }}-json: {{ printf "{{ .password%d | toJson }}" $index | quote }}
        {{- end }}
  data:
    {{- range $index, $name := list "demo-operator" "demo-observer" "bdd-operator" "bdd-observer" }}
    - secretKey: password{{ $index }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.externalSecrets.personaPathPrefix $name | quote }}
        property: password
    {{- end }}
{{- end }}
