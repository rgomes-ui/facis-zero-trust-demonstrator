{{- if eq .Values.deployment.mode "new" -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace .Values.deployment.runtimeSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.deployment.runtimeSecret }}
  annotations: {helm.sh/resource-policy: keep}
  labels:
    {{- include "ztd.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.admin.passwordKey }}: {{ if $old }}{{ required "Existing runtime Secret lacks admin password key" (index $old.data .Values.admin.passwordKey) | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.admin.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ if $old }}{{ required "Existing runtime Secret lacks POSTGRES_PASSWORD" (index $old.data "POSTGRES_PASSWORD") | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
{{- end }}
