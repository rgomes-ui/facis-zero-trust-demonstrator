{{- include "ztd.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ztd.fullname" . }}-realm
  labels:
    {{- include "ztd.labels" . | nindent 4 }}
data:
  facis-ztd.json: |-
    {{- tpl (.Files.Get "files/realm.json") . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ztd.fullname" . }}-connection
  labels:
    {{- include "ztd.labels" . | nindent 4 }}
data:
  issuer: {{ printf "%s/realms/facis-ztd" (trimSuffix "/" .Values.keycloak.publicUrl) | quote }}
  clientId: ztd-ui
  scope: openid profile roles
  pkce: S256
  callbackUrl: {{ include "ztd.callback" . | quote }}
  frontchannelLogoutUrl: {{ include "ztd.frontLogout" . | quote }}
  backchannelLogoutUrl: {{ include "ztd.backLogout" . | quote }}
  postLogoutRedirectUrl: {{ include "ztd.afterLogout" . | quote }}
