apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "puller.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "puller.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# What one run may do: read and patch the one parent Application, and record Events on it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "puller.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "puller.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [{{ .Values.argocd.application | quote }}]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "puller.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "puller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "puller.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "puller.name" . }}
    namespace: {{ .Release.Namespace }}
