# The namespace is default-deny (deployment/argocd/argocd-values.yaml) with lanes for every pod to
# DNS and, written by the installer, to the API server. This lane is the puller's own: the registry,
# on its port, at any address - the package is on a public host, as the repo server's Git lane is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "puller.name" . }}-registry-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "puller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "puller.selector" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { port: {{ .Values.egress.registryPort }}, protocol: TCP }
