# Values of the ztd umbrella chart. Every key is documented here and in README.md.

# --------------------------------------------------------------------------------------------
# Zone record. Deliberately without defaults: the zone values file records what the cluster
# baseline observed on the real cluster, and the chart refuses to render without it
# (values.schema.json), so a zone can never be installed on assumed values.
# --------------------------------------------------------------------------------------------
zone:
  name: ""               # zone-a | zone-b | ionos | kind
  kubernetesVersion: ""  # server version recorded at stand-up, e.g. v1.31.4; scripts/verify-umbrella asserts it
  storageClass: ""       # storage class the zone provides to persistent components
  loadBalancer:
    type: ""             # how the zone exposes services: cloud | metallb | none
  # The zone's SPIFFE trust domain: a name under the DNS zone delegated to the trust framework, one
  # per zone, never resolved (kind: kind.facis-ztd.local). Shared by SPIRE
  # (global.spire.trustDomain) and the mesh (meshConfig.trustDomain), both read from this key by
  # scripts/install-zone. Required whenever mesh.mode is not none. It is baked into the SPIRE
  # server's root CA at first start: changing it later means reinstalling SPIRE and reissuing every
  # identity (docs/workload-identity.md).
  trustDomain: ""

# --------------------------------------------------------------------------------------------
# Planes. Management components (SPIRE server, ArgoCD, OpenBao, Harbor, TSPA, estserver, admin
# APIs) live in management-plane namespaces; demonstrator workloads live in data-plane
# namespaces. The chart creates every namespace listed here and labels it with its plane and the
# mesh mode. The release namespace itself (README, "Release namespace") is not a plane namespace.
# --------------------------------------------------------------------------------------------
planes:
  management:
    namespace: ztd-mgmt
  data:
    namespace: ztd-data
  # Further plane namespaces: the control planes of the identity path and of the mesh, and any
  # namespace a component task adds. Each entry gets the plane label, the default deny and the
  # baseline lanes. `mesh: false` leaves out the mesh label (default true): the SPIRE server, the
  # controller-manager, istiod and the Istio CNI agent must never receive a sidecar.
  extra: []
  # - name: spire-system
  #   plane: management
  #   mesh: false
  # - name: istio-system
  #   plane: management
  #   mesh: false
  # Labels the cluster's provider asks of the namespaces it should leave alone, set on every
  # namespace the umbrella creates (plane and control-plane namespaces), a zone fact. On the Gardener
  # clusters of zone A and zone B: apiserver-proxy.networking.gardener.cloud/inject: disable, which
  # keeps the provider's webhook from pointing the pods at the API server's public name, so that they
  # reach it through the kubernetes Service and the kubeApi lane. Never the plane or the mesh label.
  namespaceLabels: {}

# --------------------------------------------------------------------------------------------
# Mesh mode. ADR-0009 baselines Istio sidecar mode with Cilium as the CNI, superseding the ambient
# baseline of ADR-0001 (the mesh cannot take SPIRE-issued identities under ambient). Ambient is
# parked, not abandoned: the value stays accepted and the Cilium host-probe exception below still
# renders in that mode, so returning is a zone value, not a chart change. Only the namespace label
# changes between the modes, so the chart is the same either way:
#   sidecar -> istio-injection=enabled             ambient -> istio.io/dataplane-mode=ambient
#   none    -> no mesh label (a cluster without Istio, such as a plain kind cluster)
# Istio itself is installed by the mesh task after this chart; until then the label is inert.
# --------------------------------------------------------------------------------------------
mesh:
  mode: sidecar
  revision: ""  # sidecar mode may pin an Istio revision (istio.io/rev) instead of the default injector

# --------------------------------------------------------------------------------------------
# CNI-specific pieces. The openings whose source is an entity (the API server, the
# host-networked SPIRE agents) and the API lane (networkPolicy, below) are Cilium policies; with a
# mesh and without Cilium the chart refuses to render, because another CNI needs a declared
# derogation (docs/workload-identity.md). Under Istio ambient (the parked mode) with Cilium, a
# default-deny NetworkPolicy blocks the kubelet health probes, which Istio SNATs to 169.254.7.127;
# the documented remedy is a cluster-wide Cilium policy admitting that address. Rendered only with
# cilium enabled AND mode ambient; nothing is rendered in sidecar mode.
# See https://istio.io/latest/docs/ambient/install/platform-prerequisites/ (istio/istio#49277).
# --------------------------------------------------------------------------------------------
cni:
  cilium:
    enabled: true

# --------------------------------------------------------------------------------------------
# Network-layer baseline: default DENY in both directions in every plane namespace. The only
# openings are the ones below and the allow matrix. The mesh layer (AuthorizationPolicy on named
# identities) sits on top and belongs to the mesh task; NetworkPolicy opens the L3/L4 lane only.
# --------------------------------------------------------------------------------------------
networkPolicy:
  defaultDeny: true
  # Declared bypass, workloads -> DNS (docs/architecture.md, section 6): the resolver's port only.
  dns:
    enabled: true
    namespace: kube-system
    podSelector:
      k8s-app: kube-dns
    # The port the resolver pods listen on (the targetPort of the kube-dns Service; a network policy
    # matches the pod's port, not the Service's), UDP and TCP. 53 on kind; 8053 on Gardener.
    ports: [53]
  # Pods inside one plane namespace may reach each other at the network layer; whether they may
  # actually talk is decided on identity by the mesh layer, not on IP.
  intraPlane: true
  # Egress from management-plane namespaces to the Kubernetes API, for controllers such as the
  # SPIRE server and controller-manager and istiod. Off here: the API endpoint is a per-zone fact
  # that the baseline records, so it is set in the zone values file. Required wherever mesh.mode is
  # not none (values.schema.json). With Cilium (cni.cilium.enabled) the lane is a CiliumNetworkPolicy
  # to the kube-apiserver entity on the kubernetes Service port 443 and on `ports`, and `cidrs` is
  # not used: a Kubernetes ipBlock does not match the API server's identity under Cilium. Without
  # Cilium the lane is an ipBlock egress to `cidrs` (required) on `ports`. `ports` is the port the
  # API server listens on behind the kubernetes Service.
  kubeApi:
    enabled: false
    cidrs: []     # e.g. ["10.0.0.1/32"]; used only without Cilium
    ports: [6443]

  # ------------------------------------------------------------------------------------------
  # Declared openings of the control planes (docs/architecture.md, section 6, beside the DNS
  # bypass): entries of the cluster-administration class, not rows of the allow matrix. Each is
  # rendered only when the zone enables it. Nothing else opens toward spire-system or istio-system.
  # ------------------------------------------------------------------------------------------
  # Sidecars of every plane namespace that carries the mesh label -> istiod on the xDS port: an
  # egress policy in each meshed plane namespace and the matching ingress in the mesh control-plane
  # namespace (Kubernetes NetworkPolicy; the source is a pod).
  meshControlPlane:
    enabled: false
    namespace: istio-system
    podSelector:
      app: istiod
    port: 15012
  # The API server -> the admission webhooks of the two control planes, as a CiliumNetworkPolicy
  # by entity in each namespace (a Kubernetes policy cannot name the API server). A self-hosted API
  # server runs on the host network of a control-plane node, and Cilium sees its calls to a pod on
  # another node with the identity of that node (remote-node), on its own node as host: the
  # kube-apiserver entity matches only the API server's own address. A run of the mesh identity
  # proof shows it (scripts/verify-mesh-identity/README.md), so the lane names the three entities, on
  # the webhook port of the webhook pod only.
  controlPlaneWebhooks:
    enabled: false
    fromEntities: [kube-apiserver, host, remote-node]
    # A provider whose API server runs outside the cluster may reach the webhooks through a pod of
    # its own (Gardener: the vpn-shoot pod in kube-system), which Cilium sees as that pod, not as an
    # entity, when it runs on the webhook pod's node. Its Cilium endpoint selectors go here, a zone
    # fact (k8s:io.kubernetes.pod.namespace and at least one pod label); the lane stays on the
    # webhook port of the webhook pod. Empty by default; never an address.
    fromEndpoints: []
    targets:
      - name: istiod
        namespace: istio-system
        podSelector:
          app: istiod
        port: 15017
      - name: spire-controller-manager   # a container of the SPIRE server pod
        namespace: spire-system
        podSelector:
          app.kubernetes.io/name: server
        port: 9443
  # The host-networked SPIRE agents -> the SPIRE server, as a CiliumNetworkPolicy fromEntities host
  # and remote-node (the agents run on the host network; no pod selector or ipBlock names them).
  # The sidecar reaches its agent over the CSI-mounted socket and the agent reaches the kubelet over
  # the host's loopback, so neither needs an opening.
  identityServer:
    enabled: false
    namespace: spire-system
    podSelector:
      app.kubernetes.io/name: server
    port: 8081
    fromEntities: [host, remote-node]

# --------------------------------------------------------------------------------------------
# The ZT-55 allow matrix, data plane -> management plane (docs/architecture.md, section 6), as
# data. Each entry opens one lane at the network layer: an egress rule in the source namespace
# and an ingress rule in the destination namespace. `enforcedBy` records the layer the
# architecture names as the enforcing one; it is documentation, the lane is opened either way.
# The selectors are the label contract with the component tasks: a component that lands under
# another name updates the matrix here, not the templates. Ports are narrowed when the component
# lands; an entry without ports opens every port of the selected pods.
# The identity provider's token endpoint is not a lane: no data-plane workload calls it, because
# the participant backend obtains its authorization from the connector (docs/keycloak.md).
# --------------------------------------------------------------------------------------------
allowMatrix:
  - name: pdp-adapter-to-tsa
    from: { plane: data, podSelector: { app.kubernetes.io/name: pdp-adapter } }
    to: { plane: management, podSelector: { app.kubernetes.io/name: tsa-policy-engine } }
    enforcedBy: mesh
  - name: atls-gateway-to-cmcd
    from: { plane: data, podSelector: { app.kubernetes.io/name: atls-gateway } }
    to: { plane: management, podSelector: { app.kubernetes.io/name: cmcd } }
    enforcedBy: mesh
  - name: atls-gateway-to-tcr
    from: { plane: data, podSelector: { app.kubernetes.io/name: atls-gateway } }
    to: { plane: management, podSelector: { app.kubernetes.io/name: tcr } }
    enforcedBy: mesh
  - name: workloads-to-otel-collector
    from: { plane: data, podSelector: {} }
    to:
      plane: management
      podSelector: { app.kubernetes.io/name: otel-collector }
      ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
    enforcedBy: mesh  # export only, egress-restricted by the mesh (ZT-26)
  - name: backend-to-verification-service
    from: { plane: data, podSelector: { app.kubernetes.io/name: backend } }
    to: { plane: management, podSelector: { app.kubernetes.io/name: verification-service } }
    enforcedBy: mesh

# --------------------------------------------------------------------------------------------
# Verification hook: the chart's own use of the hook-weight scheme (band "verification"). After
# install or upgrade a Job reads the layout back through the API and fails the release if a plane
# namespace, its plane label, its mesh label or its default-deny policy is missing, so
# `helm install --wait --wait-for-jobs` is a proof and not a hope. It runs in the release
# namespace, outside the default-deny, and needs only read access to namespaces and policies.
# --------------------------------------------------------------------------------------------
verification:
  enabled: true
  image: docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b

# --------------------------------------------------------------------------------------------
# OpenBao (ZT-11, ADR-0004; docs/secrets.md). Off by default: a zone turns it on. Everything under
# `openbao` except `enabled` goes to the upstream chart (0.28.3, OpenBao v2.5.4), which installs one
# standalone server with file storage on a volume in the management plane. Two values must repeat
# facts the umbrella already has, because Helm does not template a subchart's values: the namespace
# (= planes.management.namespace) and the storage class (= zone.storageClass); the chart refuses to
# render when they differ. The server listens without TLS inside the management plane; transport
# protection between workloads is the mesh layer's (ADR-0001).
# --------------------------------------------------------------------------------------------
openbao:
  enabled: false
  global:
    namespace: ztd-mgmt
  injector:
    enabled: false
  server:
    image:
      tag: "2.5.4@sha256:436eaf9778cad75507ff70ea26ace30dcbe15606e619ac3823495663d7f7c115"
    # The Kubernetes auth method is not used yet (deferred with the ZT-11 signing flow), so the
    # cluster-wide auth-delegator binding is not created.
    authDelegator:
      enabled: false
    standalone:
      enabled: true
    dataStorage:
      size: 1Gi
      storageClass: null

# Bootstrap of the bundled OpenBao: a regular Job (not a hook - a sealed server is not ready, and
# post-install hooks wait for readiness) that initialises the server once, keeps the unseal key in
# the Kubernetes Secret `ztd-openbao-bootstrap`, enables kv-v2 at secret/ and transit at transit/,
# issues a narrow periodic verification token and revokes the root token. It talks to the
# Kubernetes API from the management plane, so networkPolicy.kubeApi must be open there.
# After a restart the server is sealed until it is unsealed by hand (scripts/secrets/unseal.sh).
openbaoBootstrap:
  image: docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b

# An OpenBao the umbrella does not own, such as the one the XFSC ArgoCD deployment installs. When
# `address` is set, openbao.enabled must be false: nothing is installed or initialised, and only the
# verification hook runs, with the token in the named Secret of the management namespace.
openbaoExternal:
  address: ""
  verifyTokenSecret: ""
