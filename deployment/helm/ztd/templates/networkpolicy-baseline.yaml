{{- /*
Network-layer baseline per plane namespace: default deny in both directions, the DNS bypass, the
intra-plane lane, (management plane only, when configured) egress to the Kubernetes API, and the
declared opening from the meshed plane namespaces to istiod on the xDS port. With Cilium the API
lane is a CiliumNetworkPolicy by entity (ciliumnetworkpolicy-control-planes.yaml), not the ipBlock
form below: Cilium does not select an API server that runs on a cluster node by its address.
*/ -}}
{{- $cilium := .Values.cni.cilium.enabled }}
{{- /* A meshed zone without Cilium is refused by ciliumnetworkpolicy-control-planes.yaml, naming the
derogation; this check covers the zones without a mesh, so that a meshed zone file whose API lane is
by entity (no cidrs) gets that message rather than this one. */ -}}
{{- if and .Values.networkPolicy.kubeApi.enabled (not $cilium) (not .Values.networkPolicy.kubeApi.cidrs) (eq .Values.mesh.mode "none") }}
{{- fail "networkPolicy.kubeApi.enabled needs at least one entry in networkPolicy.kubeApi.cidrs; an empty destination would open every address" }}
{{- end }}
{{- $mcp := .Values.networkPolicy.meshControlPlane }}
{{- $meshed := list }}
{{- if ne .Values.mesh.mode "none" }}
{{- range (include "ztd.planeNamespaces" . | fromJsonArray) }}
{{- if .mesh }}{{ $meshed = append $meshed .name }}{{ end }}
{{- end }}
{{- end }}
{{- range (include "ztd.planeNamespaces" . | fromJsonArray) }}
{{- $ns := .name }}
{{- $plane := .plane }}
{{- if $.Values.networkPolicy.defaultDeny }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
  labels:
    {{- include "ztd.labels" $ | nindent 4 }}
    ztd.facis.io/plane: {{ $plane }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
{{- if $.Values.networkPolicy.dns.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ $ns }}
  labels:
    {{- include "ztd.labels" $ | nindent 4 }}
    ztd.facis.io/plane: {{ $plane }}
  annotations:
    ztd.facis.io/allow-matrix: workloads-to-dns
    ztd.facis.io/enforced-by: networkPolicy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        {{- range ($.Values.networkPolicy.dns.ports | default (list 53)) }}
        - port: {{ . }}
          protocol: UDP
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
{{- if $.Values.networkPolicy.intraPlane }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-plane
  namespace: {{ $ns }}
  labels:
    {{- include "ztd.labels" $ | nindent 4 }}
    ztd.facis.io/plane: {{ $plane }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
{{- end }}
{{- if and (eq $plane "management") $.Values.networkPolicy.kubeApi.enabled (not $cilium) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-api-egress
  namespace: {{ $ns }}
  labels:
    {{- include "ztd.labels" $ | nindent 4 }}
    ztd.facis.io/plane: {{ $plane }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range $.Values.networkPolicy.kubeApi.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $.Values.networkPolicy.kubeApi.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
{{- if and $mcp.enabled (has $ns $meshed) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mesh-control-plane-egress
  namespace: {{ $ns }}
  labels:
    {{- include "ztd.labels" $ | nindent 4 }}
    ztd.facis.io/plane: {{ $plane }}
  annotations:
    ztd.facis.io/declared-opening: meshControlPlane
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $mcp.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $mcp.podSelector | nindent 14 }}
      ports:
        - port: {{ $mcp.port }}
          protocol: TCP
{{- end }}
{{- end }}
{{- if and $mcp.enabled $meshed }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mesh-control-plane-ingress
  namespace: {{ $mcp.namespace }}
  labels:
    {{- include "ztd.labels" . | nindent 4 }}
  annotations:
    ztd.facis.io/declared-opening: meshControlPlane
spec:
  podSelector:
    matchLabels:
      {{- toYaml $mcp.podSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- range $meshed }}
                  - {{ . }}
                  {{- end }}
      ports:
        - port: {{ $mcp.port }}
          protocol: TCP
{{- end }}
