{{- /*
Mesh-wide peer authentication in the mesh root namespace: STRICT, so a proxy without a SPIRE
certificate can neither be reached in plaintext nor reach a peer. A future plaintext exception is a
namespaced PeerAuthentication recorded per path, never a change here.
*/ -}}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: {{ .Values.mesh.namespace }}
  labels:
    {{- include "zone-policy.labels" . | nindent 4 }}
spec:
  mtls:
    mode: {{ .Values.peerAuthentication.mode }}
