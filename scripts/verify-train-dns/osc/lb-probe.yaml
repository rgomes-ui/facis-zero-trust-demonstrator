# Probe: can a Service of type LoadBalancer on the OSC zone A cluster expose UDP and TCP 53 on one
# public address? A minimal CoreDNS answers a synthetic zone so the path can be queried from outside.
# Everything lives in this namespace and is deleted when the probe ends.
apiVersion: v1
kind: Namespace
metadata:
  name: lb-probe
  labels:
    ztd.facis.io/probe: loadbalancer-53
  annotations:
    ztd.facis.io/purpose: "zone manager probe: mixed-protocol LoadBalancer on port 53; temporary, delete after the test"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: corefile
  namespace: lb-probe
data:
  Corefile: |
    .:53 {
        errors
        log
        health :8080
        ready :8181
        template IN A lbprobe.test {
            match ^(.*\.)?lbprobe\.test\.$
            answer "{{ .Name }} 60 IN A 192.0.2.53"
        }
        template IN TXT lbprobe.test {
            match ^probe\.lbprobe\.test\.$
            answer "{{ .Name }} 60 IN TXT \"zone-a lb probe ok\""
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-probe
  namespace: lb-probe
  labels:
    app: dns-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-probe
  template:
    metadata:
      labels:
        app: dns-probe
    spec:
      containers:
        - name: coredns
          image: mtr.devops.telekom.de/osc/gardener/coredns/coredns:v1.13.1
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
          volumeMounts:
            - name: corefile
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: corefile
          configMap:
            name: corefile
---
apiVersion: v1
kind: Service
metadata:
  name: dns-probe
  namespace: lb-probe
  labels:
    app: dns-probe
spec:
  type: LoadBalancer
  selector:
    app: dns-probe
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
