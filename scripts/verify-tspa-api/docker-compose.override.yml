# Local round-trip overrides for the publish-API verification (write side). Not part of upstream.
# Copy next to the TSPA docker-compose.yml before `docker compose up`.
services:
  tspa-service:
    environment:
      # Exact-key overrides of application.yml via Spring's SPRING_APPLICATION_JSON.
      # - issuer-uri: point JWT validation at the compose Keycloak instead of the Fraunhofer realm
      # - signer INTERNAL: sign the trust-list VC with the classpath key instead of an external TSA
      # - zonemanager.query.status=false: (has no effect on the health indicator, kept for completeness)
      SPRING_APPLICATION_JSON: >-
        {"spring":{"security":{"oauth2":{"resourceserver":{"jwt":{"issuer-uri":"http://keycloak:8080/realms/gxfs-dev-test"}}}}},
         "trustlist":{"vc":{"signer":{"type":"INTERNAL"}}},
         "zonemanager":{"query":{"status":false}}}
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    healthcheck:
      disable: true
