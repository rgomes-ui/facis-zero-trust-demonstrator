name: Admission fixtures

# The admission test images for a real cluster (the IONOS proof): a runnable image signed and attested
# with the interim key, and one image per refusal case - unsigned, signed by an untrusted key, missing
# the SBOM, missing the mock attestation, non-Linux, an image index - published under
# ghcr.io/<owner>/<repository>/fixtures/ and each checked against its expected verdict with the
# admission provider's own code. Started by hand or by pushing a branch named fixtures/<anything>.
on:
  workflow_dispatch:
  push:
    branches: ['fixtures/**']

permissions:
  contents: read

concurrency:
  group: admission-fixtures
  cancel-in-progress: false

jobs:
  fixtures:
    name: Publish the admission fixtures
    runs-on: ubuntu-latest
    # The interim signing key lives only in this protected environment's secrets.
    environment: release
    permissions:
      contents: read
      packages: write # pushes the fixture images and their signatures to GHCR
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the pinned signing and SBOM tools
        run: |
          scripts/tools/install.sh "$RUNNER_TEMP/bin" cosign syft grype
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check the signing key
        env:
          COSIGN_INTERIM_KEY: ${{ secrets.COSIGN_INTERIM_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_INTERIM_PASSWORD }}
        run: scripts/supplychain/check-key.sh

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Image repository
        id: repo
        run: echo "path=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Publish, sign and check every fixture
        env:
          COSIGN_KEY: env://COSIGN_INTERIM_KEY
          COSIGN_INTERIM_KEY: ${{ secrets.COSIGN_INTERIM_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_INTERIM_PASSWORD }}
          IMAGEVERIFY_FLAGS: -registry-username ${{ github.actor }}
          IMAGEVERIFY_PASSWORD: ${{ github.token }}
        run: scripts/admission/publish-fixtures.sh "${{ steps.repo.outputs.path }}" fixtures.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Admission fixtures (interim key - not the client trust chain)"
            [ -f fixtures.txt ] && sed 's/^\([^ ]*\) \(.*\)$/- \1: `\2`/' fixtures.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the fixture list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admission-fixtures
          path: fixtures.txt
