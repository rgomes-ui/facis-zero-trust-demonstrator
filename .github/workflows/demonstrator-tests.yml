name: Demonstrator component tests

on:
  pull_request:
    paths:
      - 'flows/demonstrator/**'
      - 'ui/demonstrator/**'
      - 'tests/demonstrator/**'
      - '.github/workflows/demonstrator-tests.yml'
  push:
    branches: [main]
    paths:
      - 'flows/demonstrator/**'
      - 'ui/demonstrator/**'
      - 'tests/demonstrator/**'
      - '.github/workflows/demonstrator-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reuse action revisions already pinned by this repository's CI.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run all demonstrator checks (including delivery contracts)
        run: node --test tests/demonstrator/*.test.cjs
