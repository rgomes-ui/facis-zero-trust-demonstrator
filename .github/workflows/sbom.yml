name: Release SBOM (CycloneDX)

# Every published release carries a signed CycloneDX SBOM of the Go module: sbom.json, checked by
# cmd/sbomcheck, and sbom.json.sig, signed with the interim key and verifiable against
# docs/contracts/keys/interim-cosign.pub (see docs/ci-cd.md). A release counts as done only when both
# files are attached and the signature verifies; a release with no SBOM, an unsigned one, a half-finished
# upload or a pair that does not verify is regenerated from its tag and attached again. A release run
# covers the new tag, the scheduled run backfills anything that was missed, and a push to
# candidate/<anything> runs it in a fork whose default branch does not carry this workflow.
#
# The interim key lives in the release environment. That environment admits main and candidate/*; for
# the run a published release starts (it runs on the tag) to reach the key, the environment must also
# admit the release tags (v*) - a repository setting, recorded in docs/ci-cd.md.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
  release:
    types: [published]
  push:
    branches: ['candidate/**']

permissions:
  contents: read

concurrency:
  group: release-sbom
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate, sign and attach the SBOM
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # uploads the SBOM and its signature onto the release
    env:
      GH_TOKEN: ${{ github.token }}
      SBOM_NAME: sbom.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # every tag has to be reachable

      - name: Look for a Go module
        id: go-mod
        run: |
          if [ -f go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo 'No go.mod in the repository - nothing to describe in an SBOM.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go
        if: steps.go-mod.outputs.exists == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the pinned signing and SBOM tools
        if: steps.go-mod.outputs.exists == 'true'
        run: |
          scripts/tools/install.sh "$RUNNER_TEMP/bin" cosign syft
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check the signing key
        if: steps.go-mod.outputs.exists == 'true'
        env:
          COSIGN_INTERIM_KEY: ${{ secrets.COSIGN_INTERIM_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_INTERIM_PASSWORD }}
        run: scripts/supplychain/check-key.sh

      - name: Attach a signed SBOM to every release that lacks a verifying one
        if: steps.go-mod.outputs.exists == 'true'
        env:
          COSIGN_KEY: env://COSIGN_INTERIM_KEY
          COSIGN_INTERIM_KEY: ${{ secrets.COSIGN_INTERIM_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_INTERIM_PASSWORD }}
        run: |
          public=docs/contracts/keys/interim-cosign.pub
          failed=0

          # Every published release, all pages; a failed listing fails the run instead of looking empty.
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft | not) | .tag_name')"

          while read -r tag; do
            [ -n "$tag" ] || continue
            check="$(mktemp -d)"

            # Done only if both files are attached and the signature verifies.
            if gh release download "$tag" --dir "$check" --pattern "$SBOM_NAME" --pattern "$SBOM_NAME.sig" 2>/dev/null \
              && [ -s "$check/$SBOM_NAME" ] && [ -s "$check/$SBOM_NAME.sig" ] \
              && cosign verify-blob --key "$public" --insecure-ignore-tlog=true \
                   --signature "$check/$SBOM_NAME.sig" "$check/$SBOM_NAME" >/dev/null 2>&1; then
              echo "Signed SBOM already attached to $tag"
              rm -rf "$check"
              continue
            fi
            rm -rf "$check"

            if ! git cat-file -e "refs/tags/$tag:go.mod" 2>/dev/null; then
              echo "No go.mod at $tag - skipped"
              continue
            fi

            echo "Generating and signing the SBOM for $tag"
            workdir="$(mktemp -d)" out="$(mktemp -d)/$SBOM_NAME"
            git worktree add --quiet --detach "$workdir" "refs/tags/$tag"
            if scripts/supplychain/repo-sbom.sh "$workdir" "$out"; then
              gh release upload "$tag" "$out" "$out.sig" --clobber
            else
              echo "::error::could not produce a signed SBOM for $tag"
              failed=1
            fi
            git worktree remove --force "$workdir"
          done <<< "$tags"

          exit "$failed"
